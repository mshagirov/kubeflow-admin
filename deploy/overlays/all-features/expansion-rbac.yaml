apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeflow-admin-pvc-expansion
rules:
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflow-admin-pvc-expansion
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflow-admin-pvc-expansion
subjects:
  - kind: ServiceAccount
    name: kubeflow-admin
    namespace: kubeflow-admin
