apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeflow-admin-static-storage
rules:
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflow-admin-static-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflow-admin-static-storage
subjects:
  - kind: ServiceAccount
    name: kubeflow-admin
    namespace: kubeflow-admin
