# Separate, false-by-default PodDefault opt-in. PodDefaults are only changed
# inside a reviewed PVC creation or PVC deletion operation; there is no
# standalone PodDefault page or mutation endpoint. The base role already grants
# get/list so PVC deletion can detect references while creation is disabled.
# This role adds only the mutations that option needs: no wildcard resources or
# verbs, no Secrets, no exec/attach/impersonation and no Namespace deletion.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeflow-admin-poddefaults
rules:
  - apiGroups: [kubeflow.org]
    resources: [poddefaults]
    verbs: [get, list, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflow-admin-poddefaults
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflow-admin-poddefaults
subjects:
  - kind: ServiceAccount
    name: kubeflow-admin
    namespace: kubeflow-admin
