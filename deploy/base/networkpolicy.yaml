apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubeflow-admin-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kubeflow-admin
  policyTypes: [Ingress]
  ingress:
    # Both selectors must match: discover and adjust the actual ingress workload.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 8080
