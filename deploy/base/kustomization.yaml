apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kubeflow-admin
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: kubeflow-admin-config
    files:
      - config.yaml
generatorOptions:
  disableNameSuffixHash: false
labels:
  - pairs:
      app.kubernetes.io/name: kubeflow-admin
    includeSelectors: false
