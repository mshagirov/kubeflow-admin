apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflow-admin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeflow-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeflow-admin
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      serviceAccountName: kubeflow-admin
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: kubeflow-admin:configure-before-deploy
          imagePullPolicy: IfNotPresent
          args: ['-config', '/etc/kubeflow-admin/config.yaml']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/kubeflow-admin
              readOnly: true
            - name: oidc
              mountPath: /var/run/app-secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/kubeflow-admin
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kubeflow-admin-config
        - name: oidc
          secret:
            secretName: kubeflow-admin-oidc
            defaultMode: 0440
            items:
              - key: client-secret
                path: oidc-client-secret
        - name: data
          persistentVolumeClaim:
            claimName: kubeflow-admin-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
