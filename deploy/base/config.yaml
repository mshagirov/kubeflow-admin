# Configure real site values before applying. Unknown fields are rejected.
server:
  listen: ':8080'
  publicURL: https://kubeflow-admin.example.invalid
auth:
  issuerURL: https://identity.example.invalid/dex
  clientID: kubeflow-admin
  clientSecretFile: /var/run/app-secrets/oidc-client-secret
  adminGroups: [REPLACE_WITH_EXACT_ADMIN_GROUP]
  adminSubjects: []
  scopes: [openid, profile, email, groups]
  sessionMinutes: 15
  # Login-source rate limiting. The default 'global' applies only the bounded
  # global budget (safe behind the single shared reverse proxy). 'peer' trusts
  # the immediate peer address; 'forwarded' additionally requires
  # trustedProxyCIDRs and validates X-Forwarded-For right-to-left from a proxy.
  loginSourceLimit: global
  trustedProxyCIDRs: []
kubernetes:
  kubeconfig: ''
  requestTimeoutSeconds: 15
policy:
  protectedNamespaces: [default, kube-system, kube-public, kube-node-lease, kubeflow, kubeflow-system, istio-system, auth, oauth2-proxy, cert-manager, gpu-operator, knative-serving, knative-eventing, kubeflow-admin]
  allowedNamespaces: []
storage:
  # User-volume choices; database placement is configured independently.
  # Replace with your approved classes and review access modes, isolation,
  # reclaim policy and driver support before enabling writes.
  allowedStorageClasses: [REPLACE_WITH_APPROVED_CLASS]
  # Only after admission denies tenant claims for dedicated registration classes.
  isolatedStorageClasses: []
  nfsTemplates: []
  csiTemplates: []
  # Separate PV registration / template-bound PVC workflow. Empty until the
  # operator reviews backend boundaries and independent PV/PVC defaults.
  registrationTemplates: []
notebooks:
  controllerContractConfirmed: false
  gpuPresets: []
  allowedImages: []
  protectedMountPaths: [/home/jovyan, /home/jovyan/work]
database:
  # For verified BeeGFS, set journalMode: delete and
  # allowUnverifiedFilesystem: true only after the storage operator confirms
  # global file locking and remote fsync; see docs/database.md.
  path: /var/lib/kubeflow-admin/admin.db
features:
  writesEnabled: false
  staticStorage: false
  pvcExpansion: false
  podRestarts: false
  nodeCordon: false
  # Separate opt-in for Profile deletion. It is never implied by
  # writesEnabled: both must be true before the API accepts a delete
  # request, and the console only offers the capability when writes are
  # enabled. This flag grants no Kubernetes permission; the reviewed RBAC
  # grant is installed separately by the operator.
  profileDeletion: false
  # Separate opt-ins for restricted PV/PVC YAML edits and unused-only deletion.
  # Each needs writesEnabled and its own reviewed RBAC grant.
  storageEditing: false
  storageDeletion: false
  pvReclaim: false
  # Optional PVC-associated PodDefaults only; requires its separate RBAC grant.
  # Read access still detects references when mutation is disabled.
  podDefaults: false
ui:
  # Optional footer of the console. Empty by default: the console renders no
  # footer at all. The value may be plain text or a small amount of HTML for
  # branding (a company logo, a link to the support portal): it is sanitized
  # against a strict allowlist before it is rendered, and unsafe markup is
  # removed. Keep it within 16384 characters. Config is read at startup, so
  # changing it needs a rollout restart.
  footerText: ''
history:
  retentionDays: 90
  maxAuditRecords: 50000
  maxAuditBytes: 67108864
  maxOperationRecords: 100000
logging:
  # Empty path keeps JSON slog output on stdout; kubelet rotates container logs.
  path: ''
  maxSizeMiB: 10
  maxBackups: 5
  maxAgeDays: 7
