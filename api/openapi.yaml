openapi: 3.0.3
info:
  title: Kubeflow Admin implemented API
  version: 1.0.0
  description: >-
    Same-origin browser API; no bearer-token or auth bypass mode. Obtain an OIDC
    browser session, then GET /api/v1/me for the CSRF value. Every unsafe request
    needs the configured HTTPS Origin (or same-origin Referer) and X-CSRF-Token.
    POST requests accept a single strict JSON object up to 64 KiB. Plan previews
    require enabled writes and applicable validation privileges; no cluster mutation is
    committed until an actor-bound unexpired plan is submitted. No arbitrary
    Kubernetes manifests, proxy, unrestricted deletion or operation replay endpoints exist.
    Separately gated storage actions accept only a restricted YAML projection,
    not arbitrary PV/PVC manifests. Unused-only PV/PVC deletion never removes
    finalizers or forces deletion; an unused observation is not an atomic fence
    against external workloads or binders.
    Template-based static provisioning adds a standalone PV registration action
    (`pv.create.static`) and a PVC action bound to a selected existing PV
    (`pvc.create.bound`). Capacity, access modes, reclaim policy, volume mode,
    mount options and driver details are resolved from server-owned registration
    templates; the browser cannot override them. Only these new registration
    actions use read-only template capacities/access modes: the legacy combined
    `storage.create.static`, `pv.reserve-and-claim` and `pvc.create.dynamic`
    contracts intentionally keep their existing typed browser inputs and are not
    silently reinterpreted.
    Optional PodDefault work exists only inside a reviewed PVC creation or PVC
    cleanup plan. There is no standalone PodDefault page, editor or mutation
    endpoint. For dynamic PVC creation the optional PodDefault is attempted only
    after the PVC object exists; a WaitForFirstConsumer claim may still be
    Pending, so Bound is not required first and PodDefault acceptance is not
    binding, provisioning or mount readiness. An existing PodDefault may be
    overwritten only after an explicit acknowledgement and a fresh
    UID/resourceVersion check. PVC deletion reviews at most 32 related
    PodDefaults, warns about shared/external configuration and never deletes
    other PVCs. A PodDefault failure after PVC creation is reported without
    rolling back the PVC; cleanup never recreates a PodDefault. Partial PodDefault
    outcomes require manual operator review with authorized kubectl; there is no
    app repair, replay or unlock endpoint, and the PVC must never be deleted as
    rollback.
    The separately gated pod.restart action performs normal PDB-aware eviction
    of a validated Notebook-managed Pod only; no forced deletion is supported.
    The separately gated profile.delete action requests deletion of one existing
    Profile and delegates the normal cleanup to the installed Profile
    controller and Kubernetes garbage collection: it deletes no namespace
    directly and never deletes a PersistentVolume itself. PVC cascade inside
    the owned namespace still applies the StorageClass reclaim policy, so a
    Delete-policy class can delete the backing volume and its data through the
    normal Kubernetes path.
    Profile ownership is immutable in the installed Profile controller, so
    profile.update changes quotas only and refuses an owner transfer as an
    unsupported contract; owner migration and custom owner controllers are a
    separate future workflow.
    The API exposes no HTTP DELETE method: a destructive action is submitted as
    a typed plan and a typed operation, never as a direct resource delete.
    This describes the implemented subset, not all routes from design plans.
servers:
  - url: /
security:
  - browserSession: []
paths:
  /login:
    $ref: '#/paths/~1auth~1login'
  /callback:
    $ref: '#/paths/~1auth~1callback'
  /auth/signed-out:
    get:
      security: []
      summary: Public signed-out page with an explicit sign-in link
      responses:
        '200': {description: 'Script-free static HTML; no session required'}
  /signed-out:
    $ref: '#/paths/~1auth~1signed-out'
  /healthz:
    get:
      security: []
      summary: Process liveness
      responses:
        '200': {$ref: '#/components/responses/Health'}
  /readyz:
    get:
      security: []
      summary: Database and required API discovery readiness (not full RBAC)
      responses:
        '200': {$ref: '#/components/responses/Health'}
        '503': {$ref: '#/components/responses/Error'}
  /auth/login:
    get:
      security: []
      summary: Start single-use OIDC authorization-code/PKCE login
      responses:
        '303': {description: Redirect to provider; sets browser binding cookie}
        '429': {description: Login attempt rate limit exceeded}
        '500': {description: 'Safe authentication failure, possibly plain text'}
        '503': {description: 'Safe authentication failure, possibly plain text'}
  /auth/callback:
    get:
      security: []
      summary: Validate OIDC response and create authorized short-lived session
      parameters:
        - {name: code, in: query, schema: {type: string}}
        - {name: state, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        '303': {description: Redirect to console; sets secure host-only session cookie}
        '400': {description: Invalid callback; safe plain-text authentication error}
        '401': {description: Token exchange or ID-token validation failed}
        '403': {description: Identity not authorized}
        '503': {description: Identity provider or session store unavailable}
  /logout:
    post:
      summary: Revoke local session (does not terminate upstream SSO)
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
      responses:
        '303': {description: Session cleared; redirect to /auth/signed-out}
        '401': {description: Session required}
        '403': {description: Same-origin/CSRF check failed}
        '503': {description: Session store unavailable}
  /auth/logout:
    $ref: '#/paths/~1logout'
  /api/v1/me:
    get:
      summary: Current administrator identity and CSRF token
      responses:
        '200':
          description: Identity (not a capability envelope)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/inventory:
    get: &inventory
      summary: Timestamped projected resource inventory
      parameters:
        - {$ref: '#/components/parameters/Namespace'}
        - {$ref: '#/components/parameters/Profile'}
      responses:
        '200': {$ref: '#/components/responses/Inventory'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/overview:
    get:
      <<: *inventory
      summary: Timestamped inventory (not precomputed counts)
  /api/v1/profiles:
    get:
      <<: *inventory
      summary: Profile projections
  /api/v1/namespaces:
    get:
      <<: *inventory
      summary: Namespace projections
  /api/v1/pvs:
    get:
      <<: *inventory
      summary: PV projections (no backend path/handle or filesystem usage)
  /api/v1/pvcs:
    get:
      <<: *inventory
      summary: PVC projections
  /api/v1/storage-classes:
    get:
      <<: *inventory
      summary: StorageClass projections including approval hint
  /api/v1/storage-document:
    get:
      summary: Fresh restricted PV/PVC YAML projection for guarded storage management
      description: >-
        Returns only approved editable fields and immutable identity, never full
        manifests, backend addresses, volume handles, CSI attributes, annotations,
        finalizers or status. No Kubernetes mutation is performed. Server-side
        capability, namespace and StorageClass policies still apply.
      parameters:
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [PersistentVolume, PersistentVolumeClaim]}
        - name: name
          in: query
          required: true
          schema: {type: string, maxLength: 253}
        - name: namespace
          in: query
          description: Required for a PVC; empty for a cluster-scoped PV
          schema: {type: string, maxLength: 63}
      responses:
        '200':
          description: No-store restricted editable projection and current object identity
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageDocument'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/notebooks:
    get:
      <<: *inventory
      summary: Notebook desired/observed projections
  /api/v1/pods:
    get:
      <<: *inventory
      summary: Pod status projections (no env/logs)
  /api/v1/events:
    get:
      <<: *inventory
      summary: Event reason/object projections (no raw event message)
  /api/v1/quotas:
    get:
      <<: *inventory
      summary: ResourceQuota projections
  /api/v1/limit-ranges:
    get:
      <<: *inventory
      summary: LimitRange projections (names, no raw spec)
  /api/v1/role-bindings:
    get:
      <<: *inventory
      summary: RoleBinding projections (role reference only)
  /api/v1/statefulsets:
    get:
      <<: *inventory
      summary: StatefulSet projections (notebook controller children)
  /api/v1/nodes:
    get:
      <<: *inventory
      summary: Node projections (advertised extended-resource allocatable, no addresses)
  /api/v1/plans:
    post:
      summary: Prepare typed action and validate dependencies (dry-run where supported)
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Action'}
      responses:
        '201':
          description: Server-owned plan; five-minute TTL, bound to actor
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Plan'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/operations:
    get:
      summary: Recent operation window plus bounded unresolved operations
      responses:
        '200':
          description: Operations
          headers:
            X-History-Limit:
              description: Maximum ordinary recent records; unresolved operations are added separately
              schema: {type: integer, example: 1000}
            X-History-Window:
              schema: {type: string, example: recent-plus-unresolved}
            X-History-Retention-Days:
              description: Upper retention horizon; row/byte pressure may retain less
              schema: {type: integer, maximum: 90}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Operation'}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Submit the server-stored plan without accepting an edited patch
      parameters:
        - {$ref: '#/components/parameters/CSRF'}
        - {$ref: '#/components/parameters/Origin'}
        - name: Idempotency-Key
          in: header
          description: May instead be sent in JSON; both must match if supplied
          schema: {type: string, minLength: 16, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [planID]
              properties:
                planID: {type: string, minLength: 1, maxLength: 256}
                idempotencyKey: {type: string, minLength: 16, maxLength: 128}
      responses:
        '202':
          description: Queued operation, or same existing idempotent operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '415': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/operations/{id}:
    get:
      summary: Poll durable operation
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Operation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '404': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/audit:
    get:
      summary: Recent audit events within retention and storage budgets (not full archive)
      responses:
        '200':
          description: Audit records
          headers:
            X-History-Limit:
              schema: {type: integer, example: 1000}
            X-History-Window:
              schema: {type: string, example: recent-audit-events}
            X-History-Retention-Days:
              description: Upper retention horizon; row/byte pressure may retain less
              schema: {type: integer, maximum: 90}
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Audit'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    browserSession:
      type: apiKey
      in: cookie
      name: __Host-kfa-session
      description: Opaque Secure/HttpOnly/SameSite=Lax cookie, at most 15 minutes
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
      description: CSRF from current authenticated identity; forms may use csrf
    Origin:
      name: Origin
      in: header
      schema: {type: string}
      description: Must match configured HTTPS origin; same-origin Referer alternative
    Namespace:
      name: namespace
      in: query
      schema: {type: string}
      description: Exact namespace filter (cluster-scoped objects generally omitted)
    Profile:
      name: profile
      in: query
      schema: {type: string}
      description: Namespace filter alias, used only if namespace is absent
  responses:
    Health:
      description: Minimal health status
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: {type: string, enum: [ok, ready]}
    Inventory:
      description: Projected inventory, no full Kubernetes manifests
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Inventory'}
    Error:
      description: >-
        Safe failure. Handler errors are JSON with a structured error object;
        authentication, CSRF and standard HTTP routing failures may be plain text.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {$ref: '#/components/schemas/APIError'}
        text/plain:
          schema: {type: string}
  schemas:
    APIError:
      type: object
      required: [code, message, retryable]
      properties:
        code: {type: string, description: 'Stable machine code, e.g. validation_failed'}
        message: {type: string}
        retryable: {type: boolean}
    Identity:
      type: object
      required: [issuer, subject, email, groups, authenticatedAt, expiresAt]
      properties:
        issuer: {type: string}
        subject: {type: string}
        email: {type: string}
        username: {type: string, description: Provider presentation claim; never an authorization key}
        notificationScope: {type: string, description: Non-secret random per-session notification dismissal scope}
        groups: {type: array, nullable: true, items: {type: string}}
        authenticatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        csrf: {type: string}
    StorageDocument:
      type: object
      additionalProperties: false
      required: [kind, name, uid, resourceVersion, yaml]
      properties:
        kind: {type: string, enum: [PersistentVolume, PersistentVolumeClaim]}
        namespace: {type: string, description: Present for PVCs only}
        name: {type: string}
        uid: {type: string}
        resourceVersion: {type: string}
        yaml: {type: string, description: 'Restricted projection, never a full Kubernetes manifest'}
        warnings: {type: array, items: {type: string}}
    Action:
      type: object
      additionalProperties: false
      required: [kind, name]
      description: Only fields relevant to the selected kind are permitted by policy
      properties:
        kind:
          type: string
          description: >-
            Server-typed action kind. profile.update changes the quota of one
            existing Profile in place. The owner identity is immutable: the
            requested owner must equal the current owner exactly, and an owner
            transfer is refused as an unsupported contract instead of being
            applied as a broken write. profile.update also requires
            baseConfigDigest, the identity-bound canonical digest of the
            reviewed Profile name, UID, owner and quota hard map, so a stale prefill cannot overwrite a concurrent
            quota change; operator-managed quota keys the adapter does not
            manage are preserved verbatim. The deprecated profile.quota.change
            alias requires the same unchanged owner and baseConfigDigest;
            unguarded requests from older clients are refused and must be
            rebuilt after reloading the console. profile.delete requests deletion of
            one existing Profile and requires both a nonempty reason and a
            confirmName that equals the target Profile name exactly: deletion
            uses background propagation, matching kubectl, the console issues
            no Namespace DELETE, and the installed Profile controller and
            Kubernetes garbage collection perform the normal cleanup. The
            console never deletes a PersistentVolume itself. PVC cascade inside
            the owned namespace still applies the bound PV reclaim policy,
            so a Delete-policy PV can delete the backing volume and its
            data. The action succeeds only when the Profile and its owned
            namespace are both observed gone; a replacement object or a read
            error is not gone. profile.delete additionally requires the
            separately reviewed profile-deletion opt-in on the server.
            pv.edit and pvc.edit require storageEditing plus writes, current
            targetUID and targetResourceVersion, and a restricted storageYAML
            document. pv.delete and pvc.delete require storageDeletion plus
            writes, current identity, reason and exact confirmName. Referenced
            PVCs and bound/reserved PVs are refused; no forced cleanup exists.
            Only with confirmPVReclaim, the separate pvReclaim feature and an
            operator-confirmed isolated StorageClass, a pvc.delete whose bound
            PV has reclaim policy Retain also removes
            only that PV's stale spec.claimRef after the PVC is confirmed gone,
            returning it to Available (a Delete-policy PV is never patched;
            this is not a data wipe). A failed or uncertain reclaim leaves the
            PVC deleted and ends needs-review without rollback or replay.
            pv.create.static creates one standalone PV from an approved
            registration template and never creates a PVC or claimRef. It
            requires storage.isolatedStorageClasses with independently enforced
            admission isolation. Otherwise unreserved creation is refused.
            pvc.create.bound creates one PVC in the selected namespace and binds
            it to the selected Available, unclaimed PV. Both resolve capacity,
            access modes, reclaim policy, volume mode, mount options and driver
            details from the server-owned template. This read-only template
            behavior is limited to the two new registration kinds. The legacy
            combined storage.create.static and pv.reserve-and-claim contracts
            intentionally keep their existing typed size/accessMode inputs, and
            pvc.create.dynamic keeps its existing size/accessMode contract; they
            are not reinterpreted as registration templates.
            pvc.create.dynamic and pvc.create.bound may optionally request one
            PodDefault when features.podDefaults is enabled. The PodDefault is
            written only after the PVC object exists. For dynamic creation a
            WaitForFirstConsumer claim may still be Pending at that point; Bound
            is not required first, and PodDefault acceptance is not binding,
            provisioning or mount readiness. An existing PodDefault name requires
            podDefault.overwrite plus a fresh reviewed UID/resourceVersion; an
            overwrite is never silent. pvc.delete may include related
            namespace-local PodDefaults only when confirmPodDefaultCleanup is
            true; at most 32 are reviewed. Referenced pods and Notebook templates,
            including stopped Notebooks, block the deletion before cleanup.
            Shared/external-managed PodDefaults are removed only after explicit
            acknowledgement; other PVCs are never deleted. A failure after the
            PVC/PV step or after some PodDefault deletions is reported as a
            partial outcome with no automatic PVC rollback and no PodDefault
            recreation. Resolve a partial PodDefault step only by manual operator
            review with authorized kubectl; there is no standalone app repair,
            replay or unlock endpoint.
          enum: [profile.create, profile.quota.change, profile.update, profile.delete, pvc.create.dynamic, storage.create.static, pv.reserve-and-claim, pv.create.static, pvc.create.bound, pvc.expand, pv.edit, pvc.edit, pv.delete, pvc.delete, notebook.start, notebook.stop, notebook.edit, pod.restart, node.cordon, node.uncordon]
        namespace:
          type: string
          description: >-
            Namespace for namespace-scoped actions. It is required for
            pvc.create.dynamic, pvc.create.bound, pvc.expand, pv.reserve-and-claim,
            storage.create.static, pv.edit/pvc.edit, and pv.delete/pvc.delete
            where applicable. It must be empty for the cluster-scoped
            pv.create.static action. Profile actions may omit it or set it to the
            Profile name.
        name:
          type: string
          description: >-
            Target object name. For profile.create it must be a DNS-1123 label
            of at most 63 characters and must be unique at creation time: an
            existing Profile or Namespace with that name is refused and never
            adopted. For profile.update and profile.delete it is the exact
            existing Profile name. For pv.create.static it is the new
            cluster-scoped PV name; for pvc.create.bound it is the new PVC name
            in the selected namespace. Duplicate names are refused, never
            adopted or overwritten.
        reason:
          type: string
          maxLength: 500
          description: 'Administrator input only; required and nonblank for pod.restart, node.cordon, node.uncordon, profile.delete, pv.delete and pvc.delete; optional for storage edits'
        confirmName:
          type: string
          maxLength: 253
          description: >-
            Raw exact target name typed back by the administrator as a second
            confirmation: the value is compared to the target object name
            exactly, without trimming or case folding. Required for
            profile.delete, pv.delete and pvc.delete, which also require a nonempty reason; ignored by
            every other kind.
        baseConfigDigest:
          type: string
          description: >-
            Canonical digest of the reviewed Profile name, UID, owner and quota hard map,
            taken from the console's own Profile observation
            (details.configDigest) and echoed back unchanged. Required for
            profile.update and profile.quota.change: the server recomputes it at prepare time and
            refuses the request when it no longer matches, so a stale
            inventory prefill cannot overwrite a concurrent quota change.
            Unrelated metadata and resourceVersion churn do not change it. Replacing
            the Profile under the same name does change it. The value is
            never user-editable and is never displayed as an editable field.
        owner:
          type: string
          description: >-
            Exact Kubeflow owner identity, not an LDAP account creation.
            profile.create requires an email-formatted value, and the check is
            syntax only: the console performs no identity-provider or LDAP
            registration lookup, so a well-formed address may still be
            unregistered. profile.update and profile.quota.change never change the owner: the requested
            value must equal the current owner exactly, and a legacy Profile
            whose owner is a configured username is accepted while that owner
            is left unmodified. Any difference is refused as an unsupported
            contract; owner transfer, owner migration and custom owner
            controllers are a separate future workflow.
        quota: {type: object, additionalProperties: {type: string}}
        targetUID:
          type: string
          description: >-
            Required current UID for pv.edit, pvc.edit, pv.delete and pvc.delete.
            pvc.create.bound also requires the selected PV's current UID so the
            plan cannot bind to a replacement or concurrently changed volume.
        targetResourceVersion:
          type: string
          description: >-
            Required current resourceVersion for pv.edit, pvc.edit, pv.delete and
            pvc.delete. pvc.create.bound also requires the selected PV's current
            resourceVersion; stale edits, deletes or binding targets must be
            reviewed again.
        storageYAML:
          type: string
          maxLength: 32768
          description: >-
            Restricted single-document YAML for pv.edit or pvc.edit only. The
            identity must match the reviewed object exactly. Approved changes
            are metadata.labels under kubeflow-admin.io/, a PV reclaim policy
            of Retain or Delete, and a PVC storage request increase. Other fields
            are hidden, uneditable and preserved. PVC growth additionally needs
            the existing expansion feature and driver/class checks. Unknown
            fields, duplicate keys, aliases, identity/status/finalizer edits,
            shrinkage and no-op edits are refused. This is not a full manifest editor.
        storageClass:
          type: string
          description: >-
            Explicit approved StorageClass. Required for pv.create.static and
            pvc.create.bound and must match the selected registration template
            and, for pvc.create.bound, the selected PV. A named approved static
            StorageClass is valid when it matches the template/PV; an empty
            class is not forced. Legacy combined/static and reservation actions
            keep their existing StorageClass rules.
        size: {type: string, description: 'Existing typed browser input for pvc.create.dynamic, storage.create.static and pv.reserve-and-claim; pv.create.static and pvc.create.bound use the template value and refuse a browser override'}
        accessMode: {type: string, description: 'Existing typed browser input for pvc.create.dynamic, storage.create.static and pv.reserve-and-claim; pv.create.static and pvc.create.bound use the template value and refuse a browser override'}
        pvName: {type: string, description: 'Selected existing cluster-scoped PV for pvc.create.bound or pv.reserve-and-claim'}
        template:
          type: string
          description: >-
            Approved server-configured template name. pv.create.static and
            pvc.create.bound use a registration template; storage.create.static
            keeps using the legacy NFS/CSI template list. No driver, handle,
            server, class or arbitrary attributes may be supplied by the browser.
        subdirectory: {type: string, description: 'Legacy storage.create.static relative NFS subdirectory; new pv.create.static uses nfsPath or beeGFSPath instead'}
        nfsPath:
          type: string
          maxLength: 4096
          description: >-
            Full canonical absolute NFS path for pv.create.static with an NFS
            registration template. For registration templates the approved root
            itself or a descendant is accepted; legacy NFS templates keep their
            strict-descendant rule. Traversal, control characters, ambiguous
            encodings and paths outside every approved root are refused. This
            does not prove server-side symlink, export or permission safety. It
            is rejected for pvc.create.bound and legacy actions.
        beeGFSPath:
          type: string
          maxLength: 128
          description: >-
            Canonical nonempty relative BeeGFS suffix for pv.create.static with a
            BeeGFS registration template, for example
            example.user/kf-shared-volume. The fixed scheme, authority and /home
            prefix come from the template. The joined final handle must be at
            most 128 bytes for CSI contract compatibility. Leading
            slash, scheme, authority, query, fragment, credentials, dot segments
            and encoded traversal are refused; the suffix cannot escape or change
            the fixed prefix. It is rejected for pvc.create.bound and legacy
            actions.
        directoryUID:
          type: string
          maxLength: 10
          pattern: '^[1-9][0-9]{0,9}$'
          description: >-
            Required nonzero canonical decimal UID for pvc.create.bound with an
            NFS registration template where the approved
            k8s-sigs.io/nfs-directory-uid annotation is enabled. The accepted
            range is 1 through 4294967294, with the upper bound enforced by the server. The annotation is intent-only
            metadata: it neither proves nor changes directory ownership. The
            actual directory, export and ownership must be prepared externally
            by the storage operator, and workload UID/GID permissions remain an
            operator responsibility. It is not accepted as a pv.create.static
            field.
        directoryGID:
          type: string
          maxLength: 10
          pattern: '^[1-9][0-9]{0,9}$'
          description: >-
            Required nonzero canonical decimal GID for pvc.create.bound with an
            NFS registration template where the approved
            k8s-sigs.io/nfs-directory-gid annotation is enabled. The accepted
            range is 1 through 4294967294, with the upper bound enforced by the server. The annotation is intent-only
            metadata: it neither proves nor changes directory ownership. The
            actual directory, export and ownership must be prepared externally
            by the storage operator, and workload UID/GID permissions remain an
            operator responsibility. It is not accepted as a pv.create.static
            field.
        podDefault:
          $ref: '#/components/schemas/PodDefaultRequest'
        confirmPodDefaultCleanup:
          type: boolean
          description: >-
            For pvc.delete only: explicit acknowledgement that the reviewed
            related PodDefaults may be removed. Required when the reviewed
            cleanup set is non-empty. At most 32 related PodDefaults are
            reviewed; a larger set is refused rather than truncated. Shared or
            externally managed PodDefaults are removed only after their warning
            is acknowledged. PodDefault deletion uses Orphan propagation so
            unreviewed dependents are not cascade-deleted. Other PVCs are never deleted, and a partial cleanup
            never triggers PVC rollback or PodDefault recreation.
        confirmPVReclaim:
          type: boolean
          description: Explicit post-delete Retain PV reclaim; requires pvReclaim, operator-confirmed isolatedStorageClasses and separate PV patch RBAC. Default false leaves the PV Released.
        container: {type: string}
        image: {type: string}
        cpuRequest: {type: string}
        cpuLimit: {type: string}
        memoryRequest: {type: string}
        memoryLimit: {type: string}
        gpuPreset: {type: string}
        gpuCount: {type: integer, format: int64, minimum: 0, nullable: true}
        mounts:
          type: array
          nullable: true
          description: Omitted/null leaves mounts unchanged; empty array requests removal
          items: {$ref: '#/components/schemas/Mount'}
        restart: {type: boolean}
        force: {type: boolean, description: 'Explicit force confirmation for node.cordon / node.uncordon (e.g. control-plane or NotReady nodes)'}
    PodDefaultRequest:
      type: object
      additionalProperties: false
      required: [name, mountPath, overwrite]
      description: >-
        Optional dedicated PodDefault substep of pvc.create.dynamic or
        pvc.create.bound when features.podDefaults is enabled. It is never a
        standalone mutation request. The PodDefault is written only after the PVC
        object exists. For dynamic creation the claim may still be Pending under
        WaitForFirstConsumer; Bound is not required first, and PodDefault
        acceptance is not binding, provisioning or mount readiness. The object
        has one PVC volume and mount in the PVC namespace, an independent
        selector derived from the final name, and provenance annotations; no
        Secret, environment, container, service or unrelated PVC content is
        accepted.
      properties:
        name:
          type: string
          maxLength: 52
          description: >-
            Final PodDefault name, suggesting the template default but editable
            subject to Kubernetes name validation. The limit is 52 bytes because
            the upstream admission webhook derives a poddefault-<name>
            annotation segment, which must fit the 63-character segment bound.
            The namespace and claimName are fixed to the PVC being created. An
            existing name is refused unless overwrite is explicitly true.
        mountPath:
          type: string
          maxLength: 4096
          description: >-
            Final absolute mount path, suggesting the template default but
            editable subject to approved-path validation. It cannot replace
            protected root/home paths or inject a subPath.
        overwrite:
          type: boolean
          description: >-
            Explicit acknowledgement to replace the dedicated spec of an
            existing non-terminating PodDefault after a fresh UID/resourceVersion
            review. The plan warns about selector changes and removal of other
            PVC references, environment or injected settings without exposing
            secret-bearing values. Unrelated metadata, ownerReferences and
            finalizers are preserved; a replacement object is never patched.
    Mount:
      type: object
      additionalProperties: false
      required: [name, claim, path]
      properties:
        name: {type: string}
        claim: {type: string, description: PVC in the same namespace}
        path: {type: string}
        readOnly: {type: boolean}
    Prepared:
      type: object
      required: [action, targetUID, resourceVersion, summary, warnings]
      properties:
        action: {$ref: '#/components/schemas/Action'}
        targetUID: {type: string}
        resourceVersion: {type: string}
        summary: {type: string}
        warnings: {type: array, nullable: true, items: {type: string}}
        changes: {type: array, items: {$ref: '#/components/schemas/Change'}}
        parentNotebook: {type: string, description: Server-validated parent used for pod restart locking}
        data:
          type: object
          additionalProperties: true
          description: Opaque safe dependency evidence; never resubmit or edit this
    Change:
      type: object
      required: [field, before, after]
      properties:
        field: {type: string}
        before:
          type: string
          description: Approved before-value; private plan previews may contain reviewed non-secret entered paths, while durable audit/acceptance values are redacted or digested.
        after:
          type: string
          description: Approved after-value; private plan previews may contain reviewed non-secret entered paths, while durable audit/acceptance values are redacted or digested.
    Plan:
      type: object
      required: [id, actor, createdAt, expiresAt, prepared]
      properties:
        id: {type: string}
        actor: {type: string, description: Issuer and subject identity key}
        actorDisplay: {type: string, description: Presentation label captured at acceptance; never authorization}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        prepared: {$ref: '#/components/schemas/Prepared'}
    Operation:
      type: object
      required: [id, planID, actor, target, action, state, step, createdAt, updatedAt]
      properties:
        id: {type: string}
        planID: {type: string}
        actor: {type: string}
        actorDisplay: {type: string}
        historyExpired: {type: boolean, description: Compact idempotency record retained after history expiration}
        target: {type: string}
        action: {type: string}
        state: {type: string, description: Durable state; incomplete recovery becomes needs-review; an offline reconciliation of an uncertain profile.delete derives a terminal state and records it in the audit}
        step: {type: string}
        error: {type: string, description: 'Safe failure/recovery guidance. A partial PodDefault outcome requires manual operator review with authorized kubectl; there is no app repair, replay or unlock endpoint, and the PVC is never deleted as rollback.'}
        profileDeleteCheckpointed: {type: boolean, description: 'True once the durable checkpoint that precedes the single Profile delete request was persisted, so a delete request may have been issued. Always present, and never cleared.'}
        mutationReceipts:
          type: array
          maxItems: 128
          items: {$ref: '#/components/schemas/MutationReceipt'}
          description: >-
            Append-only observed mutation/verification facts, persisted before
            subsequent writes and retained independently of transient plans.
            These are actual known outcomes, not planned changes. Missing
            receipts do not prove that an ambiguous request made no change.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    MutationReceipt:
      type: object
      additionalProperties: false
      required: [kind, name, uid, resourceVersion, outcome]
      description: >-
        Safe resource identity and an observed API outcome, never a manifest,
        backend path/handle or injected setting. Creation acceptance alone does
        not prove binding, provisioning, admission or mount readiness.
      properties:
        kind: {type: string, enum: [PersistentVolume, PersistentVolumeClaim, PodDefault]}
        namespace: {type: string}
        name: {type: string}
        uid: {type: string}
        resourceVersion: {type: string}
        outcome: {type: string, enum: [created, reserved, overwritten, deleted, available, bound]}
    Audit:
      type: object
      required: [id, actor, action, target, result, time]
      properties:
        id: {type: string}
        actor: {type: string}
        actorDisplay: {type: string}
        action: {type: string}
        target: {type: string}
        result: {type: string}
        operationID: {type: string}
        reason: {type: string}
        changes: {type: array, items: {$ref: '#/components/schemas/Change'}}
        time: {type: string, format: date-time}
    StorageRegistrationTemplate:
      type: object
      additionalProperties: false
      required: [name, kind, storageClass, pvCapacity, pvAccessModes, pvcRequest, pvcAccessModes, reclaimPolicy, volumeMode]
      description: >-
        Browser-safe projection of one approved NFS or BeeGFS registration
        template. It carries only fixed read-only storage values and PodDefault
        suggestions, never an existing PV's backend handle, Secret reference,
        credential, unmanaged driver attribute or arbitrary label.
      properties:
        name: {type: string}
        kind: {type: string, enum: [nfs, beegfs]}
        storageClass: {type: string}
        pvCapacity: {type: string, description: Read-only PV capacity from the template}
        pvAccessModes:
          type: array
          items: {type: string}
        pvcRequest: {type: string, description: Independent read-only PVC storage request}
        pvcAccessModes:
          type: array
          items: {type: string}
        reclaimPolicy: {type: string, enum: [Retain]}
        volumeMode: {type: string, enum: [Filesystem]}
        nfsServer: {type: string, description: Present for NFS templates only}
        nfsRoots:
          type: array
          items: {type: string}
          description: Approved absolute NFS roots for pv.create.static path validation; never an arbitrary existing PV path
        nfsMountOptions:
          type: array
          items: {type: string}
        requireDirectoryUIDGID: {type: boolean, description: Present for NFS templates that require the approved directory UID/GID annotations}
        beegfsDriver: {type: string, description: Present for BeeGFS templates; fixed reviewed driver only}
        beegfsPrefix: {type: string, description: 'Fixed scheme, authority and path prefix for a BeeGFS template; the joined final handle including the entered suffix is limited to 128 bytes'}
        podDefaultName:
          type: string
          maxLength: 52
          description: Optional suggested name; the final reviewed name remains capped at 52 bytes
        podDefaultMountPathPrefix: {type: string}
    Resource:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string}
        namespace: {type: string}
        name: {type: string}
        uid: {type: string}
        owner: {type: string}
        state: {type: string}
        desired: {type: string}
        details:
          type: object
          additionalProperties: {type: string}
          description: >-
            Safe projected facts of the observed resource. A Profile carries
            its owner kind, its quota hard map and a configDigest: the
            canonical digest of the Profile name, UID, owner and hard map that a
            profile.update request echoes back unchanged as baseConfigDigest.
            No manifest, credential or arbitrary text value is projected.
    Inventory:
      type: object
      required: [observedAt, resources]
      properties:
        observedAt: {type: string, format: date-time}
        resources: {type: array, items: {$ref: '#/components/schemas/Resource'}}
        warnings: {type: array, items: {type: string}}
        storageTemplates:
          type: array
          description: >-
            Approved registration-template projection, present only when writes
            and static storage are both enabled. This is the same safe data used
            by the storage forms; it is not a Kubernetes object list and never
            exposes an existing PV's backend details.
          items: {$ref: '#/components/schemas/StorageRegistrationTemplate'}
